    // Load state from localStorage
    function loadState() {
      const saved = localStorage.getItem('verbMasterState');
      if (saved) state = { ...state, ...JSON.parse(saved) };
    }

    function saveState() {
      localStorage.setItem('verbMasterState', JSON.stringify({
        searchHistory: state.searchHistory,
        performanceData: state.performanceData,
        settings: state.settings,
      }));
    }

    // ============ UTILS ============
    // Flatten all Ukrainian past forms (fem/masc/plural, each may hold "a/b") into one list
    function ukrPastForms(up) {
      if (!up) return [];
      if (typeof up === 'string') return up.toLowerCase().split('/').map(f => f.trim());
      return ['fem', 'masc', 'plural']
        .flatMap(k => (up[k] || '').toLowerCase().split('/'))
        .map(f => f.trim())
        .filter(Boolean);
    }

    // Display string: feminine first, then masculine, then plural
    function ukrPastDisplay(up) {
      if (!up) return '';
      if (typeof up === 'string') return up;
      const parts = [];
      if (up.fem) parts.push(up.fem + ' (ж.)');
      if (up.masc) parts.push(up.masc + ' (ч.)');
      if (up.plural) parts.push(up.plural + ' (мн.)');
      return parts.join(' / ');
    }

    function findVerbByAnyForm(searchTerm) {
      const normalized = searchTerm.toLowerCase().trim();
      return irregularVerbs.find(verb => {
        const base = verb.base.toLowerCase() === normalized;
        const past = verb.pastSimple.toLowerCase().split('/').some(f => f.trim() === normalized);
        const participle = verb.pastParticiple.toLowerCase().split('/').some(f => f.trim() === normalized);
        const ukr = verb.ukrainian && verb.ukrainian.toLowerCase().split('/').some(f => f.trim() === normalized);
        const ukrPast = verb.ukrainianPast && ukrPastForms(verb.ukrainianPast).includes(normalized);
        return base || past || participle || ukr || ukrPast;
      });
    }

    function handleSearch() {
      const term = state.searchInput.trim();
      if (!term) return;

      const result = findVerbByAnyForm(term);
      
      if (result) {
        state.searchResult = result;
        
        // Add to history
        const existingIdx = state.searchHistory.findIndex(v => v.base === result.base);
        if (existingIdx !== -1) {
          state.searchHistory[existingIdx].count += 1;
        } else {
          state.searchHistory.push({ ...result, count: 1 });
        }
        state.searchHistory = state.searchHistory.sort((a, b) => b.count - a.count);
      } else {
        state.searchResult = { notFound: true };
      }
      
      saveState();
      render();
    }

    function startGame() {
      state.gameStarted = true;
      state.currentVerbIndex = 0;
      state.score = 0;
      state.feedback = null;
      state.gameResults = null;
      state.showReviewModal = false;

      const allVerbs = state.settings.verbSet === 'all' ? irregularVerbs : irregularVerbs.slice(0, 50);
      state.gameVerbs = [];
      
      for (let i = 0; i < 10; i++) {
        const verb = allVerbs[Math.floor(Math.random() * allVerbs.length)];
        state.gameVerbs.push({
          ...verb,
          askingFor: state.settings.practiceMode === 'mixed' 
            ? (Math.random() > 0.5 ? 'pastSimple' : 'pastParticiple')
            : state.settings.practiceMode
        });
      }

      render();
    }

    function checkAnswer() {
      const verb = state.gameVerbs[state.currentVerbIndex];
      const inputElem = document.getElementById('answerInput');
      const userAnswer = inputElem.value.toLowerCase().trim();
      const correctForms = verb[verb.askingFor].toLowerCase().split('/').map(f => f.trim());
      const isCorrect = correctForms.includes(userAnswer);

      state.feedback = {
        isCorrect,
        userAnswer: inputElem.value,
        correctAnswer: verb[verb.askingFor],
      };

      // Track performance
      if (!state.performanceData.verbStats[verb.base]) {
        state.performanceData.verbStats[verb.base] = { correct: 0, incorrect: 0 };
      }

      if (isCorrect) {
        state.score += 1;
        state.performanceData.verbStats[verb.base].correct += 1;
      } else {
        state.performanceData.verbStats[verb.base].incorrect += 1;
      }

      saveState();
      render();
    }

    function nextQuestion() {
      if (state.currentVerbIndex + 1 < 10) {
        state.currentVerbIndex += 1;
        state.feedback = null;
      } else {
        // Game complete
        state.gameResults = {
          score: state.score,
          total: 10,
          answers: state.gameVerbs.map((verb, idx) => ({
            verb,
            userAnswer: document.querySelector(`[data-answer="${idx}"]`)?.value || 'skipped',
            askedFor: verb.askingFor,
          }))
        };
        state.performanceData.gameNumber += 1;
        state.gameStarted = false;
      }
      render();
    }

    // ============ RENDER ============
    function render() {
      const app = document.getElementById('app');
      const html = `
        <div class="flex flex-col min-h-screen">
          <header class="border-b border-gray-400 bg-gradient-to-b from-white to-gray-50">
            <div class="container mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16 sm:h-20">
              <div class="flex items-center space-x-4">
                <div class="text-3xl sm:text-4xl">📚</div>
                <div>
                  <h1 class="text-xl sm:text-2xl font-normal text-gray-900 tracking-wide">Verb Master</h1>
                  <p class="text-xs text-gray-600 hidden sm:block tracking-widest" style="font-size: 11px; letter-spacing: 0.08em;">— Irregular Verbs Practice —</p>
                </div>
              </div>
              <div class="flex space-x-3">
                <button onclick="state.mode='search';state.showSettings=false;render()" class="px-4 py-2 text-xs tracking-widest font-normal ${state.mode === 'search' ? 'bg-gray-900 text-gray-50 shadow-md' : 'bg-white text-gray-700 border border-gray-400 hover:bg-gray-100'}">SEARCH</button>
                <button onclick="state.mode='game';state.showSettings=false;render()" class="px-4 py-2 text-xs tracking-widest font-normal ${state.mode === 'game' ? 'bg-gray-900 text-gray-50 shadow-md' : 'bg-white text-gray-700 border border-gray-400 hover:bg-gray-100'}">GAME</button>
              </div>
            </div>
          </header>

          <main class="flex-1">
            ${state.mode === 'search' ? renderSearch() : renderGame()}
          </main>

          <footer class="border-t border-gray-400 py-6 mt-12" style="background: linear-gradient(135deg, #faf7f2 0%, #f5f0eb 100%);">
            <div class="container mx-auto px-4 sm:px-6 lg:px-8">
              <p class="text-center text-sm text-gray-700 tracking-wide" style="letter-spacing: 0.05em; font-size: 12px;">
                © ${new Date().getFullYear()} All rights reserved by 
                <a href="https://www.instagram.com/mariy.bandura" target="_blank" rel="noopener noreferrer" class="accent hover:text-gray-800 font-medium transition-colors hover:underline">Mariya Bandura</a>
              </p>
            </div>
          </footer>
        </div>
        ${state.showReviewModal && state.gameResults ? renderReviewModal() : ''}
        ${state.showStatsModal ? renderStatsModal() : ''}
      `;

      app.innerHTML = html;
    }

    function renderSearch() {
      return `
        <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12 max-w-4xl">
          <div class="card rounded p-6 sm:p-8 mb-8">
            <h2 class="text-2xl sm:text-3xl font-normal mb-8 text-gray-900 tracking-wide">Search Verb</h2>
            <div class="flex flex-col sm:flex-row gap-3">
              <div class="relative flex-1">
                <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>
                <input type="text" id="searchInput" placeholder="Enter verb in English or Ukrainian (e.g., go, went, йти)" value="${state.searchInput}" onkeypress="if(event.key==='Enter') { state.searchInput=this.value; handleSearch(); }" class="w-full pl-10 h-12 text-base border border-gray-300 rounded-md px-3 focus:outline-none focus:ring-2 focus:ring-gray-800">
              </div>
              <button onclick="state.searchInput=document.getElementById('searchInput').value; handleSearch()" class="h-12 px-6 bg-gray-900 text-gray-50 rounded hover:bg-gray-800 transition-all font-normal tracking-wide text-sm">Search</button>
            </div>
            ${state.searchResult ? (state.searchResult.notFound ? 
              `<div class="mt-6 bg-red-50 text-red-600 p-4 rounded-lg text-center">Irregular verb not found.</div>` :
              `<div class="mt-6 bg-gray-100 p-6 rounded-lg text-center">
                <div class="text-6xl mb-4">${state.searchResult.emoji}</div>
                <div class="space-y-3">
                  <div class="flex justify-between items-center">
                    <span class="text-sm font-medium text-gray-600">Infinitive (1st form):</span>
                    <span class="text-lg font-semibold text-gray-900">${state.searchResult.base}</span>
                  </div>
                  <div class="flex justify-between items-center">
                    <span class="text-sm font-medium text-gray-600">Past Simple (2nd form):</span>
                    <span class="text-lg font-semibold text-gray-900">${state.searchResult.pastSimple}</span>
                  </div>
                  <div class="flex justify-between items-center">
                    <span class="text-sm font-medium text-gray-600">Past Participle (3rd form):</span>
                    <span class="text-lg font-semibold text-gray-900">${state.searchResult.pastParticiple}</span>
                  </div>
                  ${state.searchResult.ukrainian ? `
                    <div class="flex justify-between items-center pt-3 border-t border-gray-300">
                      <span class="text-sm font-medium text-gray-600">Ukrainian (Infinitive):</span>
                      <span class="text-lg font-semibold accent">${state.searchResult.ukrainian}</span>
                    </div>
                  ` : ''}
                  ${state.searchResult.ukrainianPast ? `
                    <div class="flex justify-between items-center">
                      <span class="text-sm font-medium text-gray-600">Ukrainian (Past):</span>
                      <span class="text-lg font-semibold accent text-right">${ukrPastDisplay(state.searchResult.ukrainianPast)}</span>
                    </div>
                  ` : ''}
                </div>
              </div>`) : ''}
          </div>
          ${state.searchHistory.length > 0 ? `
            <div class="card rounded p-6 sm:p-8">
              <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl sm:text-3xl font-normal text-gray-900 tracking-wide">Search History</h2>
                <button onclick="state.searchHistory=[];saveState();render()" class="text-gray-600 hover:text-gray-900 transition-all flex items-center text-sm tracking-wide">Clear</button>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                ${state.searchHistory.map(v => `
                  <div class="stat-box p-4 hover:shadow-md transition-all">
                    <div class="flex items-center justify-between mb-2">
                      <div class="flex items-center space-x-3">
                        <span class="text-3xl">${v.emoji}</span>
                        <span class="font-normal text-gray-900">${v.base}</span>
                      </div>
                      <span class="text-xs bg-gray-300 text-gray-800 px-2 py-1 rounded text-center" style="font-size: 10px; font-weight: 500; letter-spacing: 0.05em;">${v.count}×</span>
                    </div>
                    <div class="text-sm text-gray-700">Past: <span class="accent font-medium">${v.pastSimple}</span></div>
                    ${v.ukrainian ? `<div class="text-xs text-gray-600 mt-2" style="font-style: italic;">🇺🇦 ${v.ukrainian}${v.ukrainianPast ? `, ${ukrPastDisplay(v.ukrainianPast)}` : ''}</div>` : ''}
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderGame() {
      if (!state.gameStarted) {
        const totalCorrect = Object.values(state.performanceData.verbStats).reduce((s, st) => s + st.correct, 0);
        const totalIncorrect = Object.values(state.performanceData.verbStats).reduce((s, st) => s + st.incorrect, 0);
        const accuracy = (totalCorrect + totalIncorrect) > 0 ? Math.round((totalCorrect / (totalCorrect + totalIncorrect)) * 100) : 0;

        return `
          <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12 max-w-2xl">
            ${!state.showSettings ? `
              <button onclick="state.showSettings=true;render()" class="mb-4 px-4 py-2 bg-gray-200 text-gray-800 rounded hover:bg-gray-300 transition-all text-sm flex items-center tracking-wide font-normal">⚙️ Game Settings</button>
            ` : `
              <div class="card rounded p-6 mb-6">
                <div class="flex items-center justify-between mb-4">
                  <h3 class="text-lg font-semibold text-gray-900">Game Settings</h3>
                  <button onclick="state.showSettings=false;render()" class="text-gray-500 hover:text-gray-700">✕</button>
                </div>
                <div class="mb-6">
                  <label class="text-sm font-medium text-gray-900 mb-3 block">Practice Mode</label>
                  <div class="space-y-2">
                    ${['mixed', 'pastSimple', 'pastParticiple'].map(opt => {
                      const labels = { mixed: 'Mixed (Random)', pastSimple: 'Past Simple Only', pastParticiple: 'Past Participle Only' };
                      return `<button onclick="state.settings.practiceMode='${opt}';saveState();render()" class="w-full text-left p-3 rounded-lg border transition-all ${state.settings.practiceMode === opt ? 'border-gray-900 bg-gray-100' : 'border-gray-300 bg-white hover:bg-gray-50'}">${labels[opt]}</button>`;
                    }).join('')}
                  </div>
                </div>
                <div class="mb-6">
                  <label class="text-sm font-medium text-gray-900 mb-3 block">Verb Set</label>
                  <div class="space-y-2">
                    ${['top50', 'all'].map(opt => {
                      const labels = { top50: 'Top 50 Verbs', all: 'All 75+ Verbs' };
                      return `<button onclick="state.settings.verbSet='${opt}';saveState();render()" class="w-full text-left p-3 rounded-lg border transition-all ${state.settings.verbSet === opt ? 'border-gray-900 bg-gray-100' : 'border-gray-300 bg-white hover:bg-gray-50'}">${labels[opt]}</button>`;
                    }).join('')}
                  </div>
                </div>
              </div>
            `}

            <div class="card rounded p-6 sm:p-8 mb-8">
              <div class="text-center">
                <h2 class="text-3xl sm:text-4xl font-normal text-gray-900 mb-4">Ready to Play?</h2>
                <p class="text-gray-600 mb-6">Test your knowledge of irregular verbs</p>
                <button onclick="startGame()" class="w-full px-8 h-12 text-base bg-gray-900 text-white rounded-md hover:bg-gray-800 transition-all font-medium">Start Game</button>
              </div>
            </div>

            ${state.performanceData.gameNumber > 0 ? `
              <div class="card rounded p-6 sm:p-8">
                <h3 class="text-xl font-semibold text-gray-900 mb-4">Your Statistics</h3>
                <div class="grid grid-cols-3 gap-4">
                  <div class="stat-box p-4 text-center">
                    <div class="text-2xl font-bold accent">${state.performanceData.gameNumber}</div>
                    <div class="text-xs text-gray-600 mt-2">Games Played</div>
                  </div>
                  <div class="stat-box p-4 text-center">
                    <div class="text-2xl font-bold accent">${totalCorrect}</div>
                    <div class="text-xs text-gray-600 mt-2">Correct</div>
                  </div>
                  <div class="stat-box p-4 text-center">
                    <div class="text-2xl font-bold accent">${accuracy}%</div>
                    <div class="text-xs text-gray-600 mt-2">Accuracy</div>
                  </div>
                </div>
              </div>
            ` : ''}
          </div>
        `;
      } else {
        const verb = state.gameVerbs[state.currentVerbIndex];
        const progress = ((state.currentVerbIndex / 10) * 100);

        return `
          <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12 max-w-2xl">
            <div class="mb-6">
              <div class="flex justify-between items-center mb-3">
                <span class="text-sm font-medium text-gray-600">Question ${state.currentVerbIndex + 1} of 10</span>
                <div class="flex items-center space-x-4">
                  <span class="text-sm font-semibold accent">Score: ${state.score}/${state.currentVerbIndex}</span>
                  <button onclick="state.gameStarted=false;state.currentVerbIndex=0;render()" class="text-red-600 hover:text-red-700 text-sm">Exit</button>
                </div>
              </div>
              <div class="w-full bg-gray-200 rounded-full h-2">
                <div class="bg-gray-900 h-2 rounded-full transition-all" style="width: ${progress}%"></div>
              </div>
            </div>
            <div class="card rounded p-8 sm:p-12">
              <div class="text-center mb-8">
                <div class="text-6xl mb-4">${verb.emoji}</div>
                <div class="mb-4">
                  <span class="text-lg px-4 py-2 mb-3 bg-gray-900 text-white rounded-md inline-block">Infinitive: ${verb.base}</span>
                </div>
                <h3 class="text-lg sm:text-xl font-normal text-gray-900 mb-2">What's the ${verb.askingFor === 'pastSimple' ? 'Past Simple (2nd form)' : 'Past Participle (3rd form)'}?</h3>
                <p class="text-gray-500 text-sm">${verb.askingFor === 'pastSimple' ? 'Example: I ____ yesterday' : 'Example: I have ____'}</p>
              </div>
              ${!state.feedback ? `
                <div class="space-y-4">
                  <input type="text" id="answerInput" placeholder="Type your answer..." class="w-full h-12 text-base text-center border border-gray-300 rounded-md px-3 focus:outline-none focus:ring-2 focus:ring-gray-800" onkeypress="if(event.key==='Enter'&&!state.feedback) { event.preventDefault(); checkAnswer(); }">
                  <button onclick="checkAnswer()" class="w-full h-12 text-base bg-gray-900 text-white rounded-md hover:bg-gray-800 transition-all">Check Answer</button>
                </div>
              ` : `
                <div class="space-y-6">
                  <div class="p-6 rounded-lg text-center ${state.feedback.isCorrect ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700'}">
                    <div class="flex items-center justify-center mb-3">
                      <span class="text-4xl">${state.feedback.isCorrect ? '✓' : '✕'}</span>
                    </div>
                    <p class="text-lg font-semibold mb-2">${state.feedback.isCorrect ? 'Correct!' : 'Incorrect'}</p>
                    ${!state.feedback.isCorrect ? `
                      <div class="text-sm">
                        <p class="mb-2"><strong>Your answer:</strong> <span class="font-semibold">${state.feedback.userAnswer}</span></p>
                        <p><strong>Correct answer:</strong> <span class="font-bold text-base">${state.feedback.correctAnswer}</span></p>
                      </div>
                    ` : ''}
                  </div>
                  <button id="nextButtonRef" onclick="nextQuestion()" class="w-full h-12 text-base bg-gray-900 text-white rounded-md hover:bg-gray-800 transition-all">${state.currentVerbIndex + 1 >= 10 ? 'View Results' : 'Next Question'}</button>
                </div>
              `}
            </div>
          </div>
        `;
      }
    }

    function renderReviewModal() {
      return `
        <div class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4" onclick="if(event.target===this) { state.showReviewModal=false; render(); }">
          <div class="w-full max-w-3xl card rounded flex flex-col shadow-2xl" style="maxHeight: 600px" onclick="event.stopPropagation()">
            <div class="p-4 sm:p-6 border-b border-gray-300 flex-shrink-0">
              <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2 sm:space-x-3">
                  <h2 class="text-lg sm:text-xl font-semibold text-gray-900">Review Your Answers</h2>
                </div>
                <button onclick="state.showReviewModal=false;render()" class="text-gray-400 hover:text-gray-600 transition-colors">✕</button>
              </div>
            </div>
            <div class="p-4 sm:p-6 overflow-y-auto flex-1">
              <div class="space-y-3">
                ${state.gameResults.answers.map((ans, idx) => {
                  const correct = ans.verb[ans.askedFor].toLowerCase().split('/').map(f => f.trim());
                  const isCorrect = correct.includes(ans.userAnswer.toLowerCase().trim());
                  return `
                    <div class="p-3 sm:p-4 rounded-lg border-2 ${isCorrect ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}">
                      <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center space-x-3">
                          <span class="text-2xl">${ans.verb.emoji}</span>
                          <div>
                            <span class="font-semibold text-gray-900 text-base sm:text-lg">${ans.verb.base}</span>
                            <span class="ml-2 text-xs bg-white px-2 py-1 rounded">${ans.verb.level}</span>
                          </div>
                        </div>
                        <span class="text-xl">${isCorrect ? '✓' : '✕'}</span>
                      </div>
                      <div class="text-sm space-y-1">
                        <div class="text-gray-700"><strong>Asked for:</strong> ${ans.askedFor === 'pastSimple' ? 'Past Simple' : 'Past Participle'}</div>
                        <div class="${isCorrect ? 'text-green-700' : 'text-red-700'}"><strong>Your answer:</strong> ${ans.userAnswer}</div>
                        ${!isCorrect ? `<div class="text-gray-900"><strong>Correct answer:</strong> ${ans.verb[ans.askedFor]}</div>` : ''}
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
            <div class="p-4 sm:p-6 border-t border-gray-300 bg-gray-100 flex-shrink-0">
              <button onclick="state.showReviewModal=false;render()" class="w-full h-10 sm:h-12 text-sm sm:text-base font-medium bg-white text-gray-700 border border-gray-300 rounded-md hover:bg-gray-50 transition-all">Go Back</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderStatsModal() {
      const titles = { toReview: 'Verbs to Review', correct: 'Verbs You Got Correct', incorrect: 'Verbs You Got Incorrect' };
      
      let verbs = [];
      if (state.showStatsModal === 'correct') {
        verbs = Object.entries(state.performanceData.verbStats)
          .map(([b, st]) => ({ ...irregularVerbs.find(v => v.base === b), correctCount: st.correct }))
          .filter(v => v.base)
          .sort((a, b) => b.correctCount - a.correctCount);
      } else if (state.showStatsModal === 'incorrect') {
        verbs = Object.entries(state.performanceData.verbStats)
          .map(([b, st]) => ({ ...irregularVerbs.find(v => v.base === b), incorrectCount: st.incorrect }))
          .filter(v => v.base)
          .sort((a, b) => b.incorrectCount - a.incorrectCount);
      }

      return `
        <div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4" onclick="if(event.target===this) { state.showStatsModal=null; render(); }">
          <div class="w-full max-w-3xl card rounded flex flex-col shadow-2xl" style="maxHeight: 600px" onclick="event.stopPropagation()">
            <div class="p-4 sm:p-6 border-b border-gray-300 flex-shrink-0">
              <div class="flex items-center justify-between">
                <h2 class="text-lg sm:text-xl font-semibold text-gray-900">${titles[state.showStatsModal]}</h2>
                <button onclick="state.showStatsModal=null;render()" class="text-gray-400 hover:text-gray-600 transition-colors">✕</button>
              </div>
            </div>
            <div class="p-4 sm:p-6 overflow-y-auto flex-1">
              ${verbs.length === 0 ? `
                <div class="text-center py-8 text-gray-500">
                  <p class="text-base">No verbs in this category yet.</p>
                </div>
              ` : `
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  ${verbs.map(v => `
                    <div class="p-3 rounded-lg border border-gray-300 bg-white hover:bg-gray-100 transition-all">
                      <div class="flex items-start justify-between mb-2">
                        <div class="flex items-center space-x-2">
                          <span class="text-xl">${v.emoji}</span>
                          <div>
                            <div class="flex items-center space-x-2">
                              <span class="font-semibold text-gray-900">${v.base}</span>
                              <span class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded">${v.level}</span>
                            </div>
                          </div>
                        </div>
                      </div>
                      <div class="text-sm text-gray-600">Past: <span class="text-gray-900 font-medium">${v.pastSimple}</span></div>
                      ${v.correctCount ? `<div class="mt-2 text-green-600 text-xs flex items-center">✓ ${v.correctCount} time${v.correctCount > 1 ? 's' : ''}</div>` : ''}
                      ${v.incorrectCount ? `<div class="mt-2 text-red-600 text-xs flex items-center">✕ ${v.incorrectCount} time${v.incorrectCount > 1 ? 's' : ''}</div>` : ''}
                    </div>
                  `).join('')}
                </div>
              `}
            </div>
            <div class="p-4 sm:p-6 border-t border-gray-300 bg-gray-100 flex-shrink-0">
              <button onclick="state.showStatsModal=null;render()" class="w-full h-10 sm:h-12 text-sm sm:text-base font-medium bg-white text-gray-700 border border-gray-300 rounded-md hover:bg-gray-50 transition-all">Go Back</button>
            </div>
          </div>
        </div>
      `;
    }

    loadState();
    render();
  </script>
</body>
</html>
